[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerops-agent"
version = "0.1.0"
description = "Job intelligence and career planning foundation for AI Agent roles"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "openai>=2.0,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
careerops-debug = "app.debug_cli:main"

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8.0",
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true
omit = ["app/static/*"]
fail_under = 80

[tool.setuptools.packages.find]
include = ["app*"]
